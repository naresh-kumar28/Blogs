<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Django</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-[#F59E0B] selection:text-white">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm h-16 flex items-center">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex justify-between items-center">
            
            <div class="flex items-center gap-3">
                <a href="#" class="text-2xl font-serif font-bold text-slate-900 tracking-tight">
                    Django<span class="text-[#F59E0B]">.</span>
                </a>
                <span class="border-l border-slate-300 pl-3 text-sm font-semibold text-slate-500 uppercase tracking-widest mt-1 hidden sm:block">
                    Workspace
                </span>
            </div>

            <div class="flex items-center gap-6">
                <a href="{% url 'home' %}" class="text-sm font-medium text-slate-500 hover:text-[#F59E0B] transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                    <span class="hidden sm:block">View Live Site</span>
                </a>

                <div class="flex items-center gap-3 pl-6 border-l border-slate-200 cursor-pointer group">
                    <div class="w-9 h-9 rounded-full bg-[#F59E0B]/10 flex items-center justify-center text-[#F59E0B] font-bold text-sm ring-2 ring-transparent group-hover:ring-[#F59E0B]/30 transition-all">
                        {{ user.username|make_list|first|default:"A"|upper }}
                    </div>
                    <div class="text-right hidden md:block">
                        <p class="text-sm font-bold text-slate-800">{{ user.username|default:"Admin" }}</p>
                        
                    </div>
                    
                </div>
            </div>
            
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <aside class="lg:col-span-3 sticky top-24">
                <nav class="bg-white border border-slate-100 shadow-sm rounded-3xl p-4 md:p-5 space-y-1.5">
                    
                    <a href="{% url 'dashboard' %}" class="group flex items-center gap-3 px-4 py-3 rounded-2xl font-semibold transition-all {% if request.path == '/dashboard/' %}bg-[#F59E0B] text-white shadow-md shadow-[#F59E0B]/20{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
                        <svg class="w-5 h-5 {% if request.path == '/dashboard/' %}text-white{% else %}text-slate-400 group-hover:text-[#F59E0B]{% endif %} transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                        </svg>
                        Dashboard
                    </a>

                    {% if perms.auth.view_user %}
                    <a href="{% url 'users' %}" class="group flex items-center gap-3 px-4 py-3 rounded-2xl font-medium transition-all {% if '/users/' in request.path %}bg-[#F59E0B] text-white font-semibold shadow-md shadow-[#F59E0B]/20{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
                        <svg class="w-5 h-5 {% if '/users/' in request.path %}text-white{% else %}text-slate-400 group-hover:text-[#F59E0B]{% endif %} transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        Users
                    </a>
                    {% endif %}

                    <a href="{% url 'category' %}" class="group flex items-center gap-3 px-4 py-3 rounded-2xl font-medium transition-all {% if '/category/' in request.path %}bg-[#F59E0B] text-white font-semibold shadow-md shadow-[#F59E0B]/20{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
                        <svg class="w-5 h-5 {% if '/category/' in request.path %}text-white{% else %}text-slate-400 group-hover:text-[#F59E0B]{% endif %} transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                        </svg>
                        Categories
                    </a>

                    <a href="{% url 'posts' %}" class="group flex items-center gap-3 px-4 py-3 rounded-2xl font-medium transition-all {% if '/posts/' in request.path %}bg-[#F59E0B] text-white font-semibold shadow-md shadow-[#F59E0B]/20{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
                        <svg class="w-5 h-5 {% if '/posts/' in request.path %}text-white{% else %}text-slate-400 group-hover:text-[#F59E0B]{% endif %} transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5a2.5 2.5 0 00-2.5-2.5H15" />
                        </svg>
                        Posts
                    </a>

                    <div class="pt-3 pb-1">
                        <hr class="border-slate-100">
                    </div>

                    <a href="{% url 'logout' %}" class="group flex items-center gap-3 px-4 py-3 rounded-2xl font-medium transition-all text-slate-600 hover:bg-red-50 hover:text-red-600">
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-red-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Logout
                    </a>
                
                </nav>
            </aside>

            <main class="lg:col-span-9 space-y-8">
                {% block admin_content %}
                {% endblock %}
            </main>
            
        </div>
    </div>

</body>
</html>
