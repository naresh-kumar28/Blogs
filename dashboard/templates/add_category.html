{% extends "base_admin.html" %}
{% load tailwind_filters %}

{% block admin_content %}
<div class="space-y-6">

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-2">
        <div>
            <div class="flex items-center gap-4">
                <a href="{% url 'category' %}" class="p-2.5 bg-white border border-slate-200 rounded-xl text-slate-400 hover:text-[#F59E0B] hover:bg-amber-50 hover:border-amber-100 transition-all shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <h2 class="text-2xl font-serif font-bold text-slate-900">Add New Category</h2>
            </div>
            <p class="text-sm text-slate-500 mt-2 ml-14">Create a new category to organize your posts.</p>
        </div>
    </div>

    <div class="bg-white border border-slate-100 rounded-3xl shadow-sm p-8 max-w-2xl">
        
        <form action="{% url 'add_category' %}" method="POST" class="space-y-6">
            {% csrf_token %}
            
            {{form | crispy}}

            <div class="pt-4 flex items-center gap-4">
                <button type="submit" class="bg-[#F59E0B] hover:bg-[#D97706] text-white font-bold px-8 py-3.5 rounded-full text-sm transition-all duration-300 shadow-md hover:shadow-lg ">
                    Save
                </button>
                <a href="{% url 'category' %}" class="text-sm font-semibold text-slate-500 hover:text-slate-900 transition-colors">
                    Cancel
                </a>
            </div>
            
        </form>

    </div>
</div>
{% endblock %}
