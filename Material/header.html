<header class="py-6 border-b border-gray-100 flex flex-col md:flex-row items-center justify-between gap-4">

<!-- Logo -->
<div class="w-full md:w-auto">
    <a href="#" class="text-3xl font-serif font-bold text-gray-900 hover:text-brand-500 transition-colors">
        Django Blog
    </a>
</div>

<!-- Search -->
<div class="w-full md:w-1/2 max-w-md flex justify-center">
    <form class="w-full flex">
        <input
            class="w-full px-4 py-1.5 border border-gray-200 rounded-l-sm text-sm focus:outline-none focus:border-brand-500"
            type="text"
            placeholder="Enter search term..."
        >
        <button
            type="submit"
            class="bg-brand-500 hover:bg-brand-600 text-white font-medium px-4 py-1.5 rounded-r-sm text-sm transition-colors">
            Go!
        </button>
    </form>
</div>

<!-- Buttons -->
<div class="w-full md:w-auto flex justify-center md:justify-end gap-2">
    <a href="#" class="bg-brand-500 hover:bg-brand-600 text-white text-xs font-semibold px-4 py-1.5 rounded-sm transition-colors">
        Login
    </a>
    <a href="#" class="border border-gray-300 hover:bg-gray-50 text-gray-600 text-xs font-semibold px-4 py-1.5 rounded-sm transition-colors">
        Register
    </a>
</div>

</header>
