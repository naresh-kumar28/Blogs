<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Django Blog - Professional Editorial</title>

        <script src="https://cdn.tailwindcss.com"></script>

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700;800&display=swap"
            rel="stylesheet">

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'sans-serif'],
                            serif: ['Playfair Display', 'serif'],
                        },
                        colors: {
                            brand: {
                                500: '#F59E0B', 
                                600: '#D97706',
                            }
                        }
                    }
                }
            }
        </script>
    </head>

    <body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
        {% comment %} Header Part {% endcomment %}
        {% include "includes/header.html" %}


        {% comment %} Main Content {% endcomment %}
        {% block content %}
            
        
        {% endblock %}


        {% comment %} Footer Part {% endcomment %}
        {% include "includes/footer.html" %}
    </body>
</html>
