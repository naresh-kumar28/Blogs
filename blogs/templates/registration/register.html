{% extends "base.html" %}
{% load tailwind_filters %}

{% block content %}

    <div class="min-h-screen flex items-center justify-center bg-[#F8FAFC] py-12 px-4 sm:px-6 lg:px-8">
    
    <div class="w-full max-w-md bg-white shadow-xl shadow-slate-200/40 rounded-[2rem] p-8 md:p-10 border border-slate-100">
        
        <div class="text-center mb-8">
            <a href="#" class="text-3xl font-serif font-bold text-slate-900 tracking-tight">
                Django<span class="text-[#F59E0B]">.</span>
            </a>
            <h1 class="text-2xl font-serif font-bold text-slate-900 mt-6">
                Create an Account
            </h1>
            <p class="text-sm text-slate-500 mt-2 font-medium">
                Join our premium editorial community today.
            </p>
        </div>

        <form action="{% url 'register' %}" method="post" class="space-y-5">
            {% csrf_token %}
            {{form | crispy}}
            <button
                type="submit"
                class="w-full bg-[#F59E0B] text-white font-bold py-3.5 px-4 rounded-full hover:bg-[#D97706] transition-all duration-300 shadow-md hover:shadow-lg hover:-translate-y-0.5 mt-2">
                Register
            </button>
        </form>

        <div class="mt-8 text-center text-sm font-medium text-slate-500 border-t border-slate-100 pt-6">
            Already have an account? 
            <a href="#" class="text-[#F59E0B] hover:text-[#D97706] transition-colors font-bold">
                Sign in here
            </a>
        </div>
        
    </div>
</div>

{% endblock %}
