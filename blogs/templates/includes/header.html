<header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">

        <a href="{% url 'home' %}" class="text-3xl font-serif font-bold text-slate-900 tracking-tight">
            Django<span class="text-brand-500">.</span>
        </a>

        <form action="{% url 'search' %}" method="get">
        <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
            
            <input type="text" placeholder="Search for articles, topics..." name='keyword' value = "{{keyword}}" size = "60"
                class="w-full pl-5 pr-12 py-2.5 bg-slate-50 border border-slate-200 rounded-full text-sm focus:outline-none focus:bg-white focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition-all">
            <button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
            
        </div>
        </form>

        <div class="flex items-center gap-5">
        
            {% if user.is_authenticated %}
                <div class="flex items-center gap-3 pr-4 border-r border-slate-200 hidden sm:flex">
                    <span class="text-sm font-semibold text-slate-800">Hi, {{ user.username }}</span>
                </div>

                <a href="{% url 'dashboard' %}" class="bg-slate-100 text-slate-700 px-5 py-2.5 rounded-full text-sm font-medium hover:bg-brand-500 hover:text-white transition shadow-sm">
                    Dashboard
                </a>
                
                <a href="{% url 'logout' %}" class="bg-[#F59E0B] text-white px-6 py-2.5 rounded-full text-sm font-medium hover:bg-[#D97706] transition shadow-sm">Logout</a>
                
            {% else %}
                <a href="{% url 'login' %}" class="bg-slate-100 text-slate-700 px-5 py-2.5 rounded-full text-sm font-medium hover:bg-brand-500 hover:text-white transition shadow-sm">
                    Login
                </a>
                <a href="{% url 'register' %}" class="bg-[#F59E0B] text-white px-6 py-2.5 rounded-full text-sm font-medium hover:bg-[#D97706] transition shadow-sm">Register</a>
            {% endif %}
        
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 overflow-x-auto border-t border-slate-100">
        <ul class="flex gap-4 whitespace-nowrap">
            {% for cat in categories %}
            <li>
                <a href="{% url 'post_by_category' cat.slug %}" class="px-5 py-2 bg-white rounded-full shadow-sm border border-gray-100 hover:bg-brand-500 hover:text-white transition text-sm font-medium">
                    {{cat.category_name}}
                </a>
            </li>
            {% endfor %}
            
        </ul>
    </div>
</header>
